name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy al VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Clonar si es la primera vez
            mkdir -p /var/www/bets
            if [ ! -d /var/www/bets/backend ]; then
              git clone https://github.com/nahueldefazio/bet_ia_backend.git /var/www/bets/backend
            fi

            cd /var/www/bets/backend
            git pull origin main

            # Crear .env si no existe
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "⚠️  .env creado desde .env.example — completar variables en el VPS"
            fi

            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            npm run build

            mkdir -p logs

            # Reiniciar o iniciar con PM2
            if pm2 show value-betting > /dev/null 2>&1; then
              pm2 restart value-betting
            else
              pm2 start ecosystem.config.js --env production
              pm2 save
              pm2 startup | tail -1 | bash || true
            fi

            echo "✅ Backend desplegado correctamente"
